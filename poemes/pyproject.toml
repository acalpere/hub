[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "motfinal"
version = "0.1.0"
description = "Cercador de paraules catalanes per sil·laba final, tonicitat i context semàntic"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "jinja2>=3.1,<4",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "pyphen>=0.17,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
semantic = ["sentence-transformers>=3.4,<6"]
bedrock = ["boto3>=1.35,<2"]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[project.scripts]
motfinal = "motfinal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"motfinal.adapters.web" = ["ui/*"]
"motfinal.adapters.synonyms" = ["*.txt", "*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".deps"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
