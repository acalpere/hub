[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acalpere"
version = "0.1.0"
description = "acalpere: hub personal (calendari, herència, webs i agents de màrqueting)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Pere Vilarasau Rabinat" }]
dependencies = [
  "fastapi>=0.115",
  "python-multipart>=0.0.9",
  "itsdangerous>=2.2",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.4",
  "alembic>=1.13",
  "bcrypt>=4.2",
]

[project.optional-dependencies]
aws = ["boto3>=1.35", "mangum>=0.19"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "uvicorn[standard]>=0.30", "mysql-connector-python>=9"]

[project.scripts]
acalpere = "acalpere.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
acalpere = ["adapters/web/legacy/**/*", "migrations/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# B008: Depends() en els arguments és la manera normal de fer-ho a FastAPI
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
